<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Biblioteca | La Vinocracia</title>
    
    <!-- FontAwesome para los íconos del footer -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="../estilos.css">
    <!-- Estilos Propios de la sección -->
    <link rel="stylesheet" href="biblioteca.css">
    <link rel="stylesheet" href="../footer.css">
</head>
<body>

    <!-- Contenedor para el Navbar (se carga dinámicamente) -->
    <div id="navbar-container"></div>

    <main class="biblioteca-wrapper">
        
        <!-- ENCABEZADO: Título, Subtítulo y Buscador Dinámico -->
        <header class="biblioteca-header biblioteca-title">
            <h1 class="header-title">La Biblioteca</h1>
            <p class="header-subtitle">Artículos, crónicas y reflexiones alrededor de la copa.</p>
        </header>

        <!-- VISTA 1: Grilla de Polaroids (Se renderiza desde notas.js / biblioteca.js) -->
        <section id="gridNotas" class="polaroid-grid">
            <!-- Se llena dinámicamente -->
        </section>

        <!-- VISTA 2: Lector de Nota (Oculto por defecto, abre al hacer click en una Polaroid) -->
        <article id="lectorNota" class="nota-detalle-container" style="display: none;">

            <div class="nota-layout">
                <!-- Sidebar con la Polaroid de la nota -->
                <aside class="nota-sidebar">
                    <div class="biblioteca-card biblioteca-card-detalle">
                        <div class="biblioteca-card-image">
                            <img id="notaImg" src="" alt="">
                        </div>
                        <div class="biblioteca-card-caption">
                            <span id="notaFecha" class="biblioteca-card-fecha"></span>
                            <span id="notaAutor" class="biblioteca-card-autor"></span>
                        </div>
                    </div>
                    <div id="notaImagenSecundaria" class="biblioteca-polaroid-secundaria" hidden>
                        <img id="notaImgSecundaria" src="" alt="">
                    </div>
                </aside>

                <!-- Hoja de lectura con el texto completo de la nota -->
                <div class="nota-cuerpo-wrapper">
                    <span id="notaCategoria" class="badge-categoria"></span>
                    <h2 id="notaTitulo" class="nota-titulo"></h2>
                    <p id="notaBajada" class="nota-bajada"></p>
                    <hr class="nota-divider">
                    <div id="notaContenido" class="nota-texto"></div>
                </div>
            </div>
        </article>

    </main>

    <!-- FOOTER INSTITUCIONAL CENTRADO -->
    <footer class="main-footer">
        <div class="footer-container">
            
            <div class="social-wrapper">
                <a href="https://wa.me/5491161952385" target="_blank" class="social-icon" title="WhatsApp">
                    <i class="fa-brands fa-whatsapp"></i>
                </a>
                <a href="https://instagram.com" target="_blank" class="social-icon" title="Instagram">
                    <i class="fa-brands fa-instagram"></i>
                </a>
                <a href="mailto:vinocracia@gmail.com" class="social-icon" title="Correo Electrónico">
                    <i class="fa-solid fa-envelope"></i>
                </a>
            </div>

            <p class="developer-signature">Desarrollado por <span>Bilba Design</span></p>
            <div class="legal-notice">Beber con moderación. Prohibida su venta a menores de 18 años.</div>

        </div>
    </footer>

    <!-- Scripts de la lógica del catálogo y buscador -->
    <script src="notas.js"></script>
    <script src="biblioteca.js"></script>

    <!-- Carga del Navbar dinámico -->
    <script>
        fetch('../navbar.html')
            .then(res => res.text())
            .then(html => {
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                
                // Corregir la ruta de la imagen del logo
                const logoImg = doc.querySelector('.logo-img'); 
                if (logoImg) {
                    logoImg.src = '../' + logoImg.getAttribute('src');
                }

                // Corregir las rutas de todos los enlaces del navbar
                const navLinks = doc.querySelectorAll('a[href^="index.html"], a[href="laBiblioteca/laBiblioteca.html"]');
                navLinks.forEach(link => {
                    const originalHref = link.getAttribute('href');
                    if (originalHref === 'index.html') {
                        link.setAttribute('href', '../index.html'); 
                    } else if (originalHref.startsWith('index.html#')) {
                        link.setAttribute('href', '../' + originalHref); 
                    } else if (originalHref === 'laBiblioteca/laBiblioteca.html') {
                        link.setAttribute('href', '#'); 
                    }
                });
                
                document.getElementById('navbar-container').innerHTML = doc.body.innerHTML; 

                const menuToggle = document.querySelector('.nav-menu-toggle');
                const navMenu = document.querySelector('.nav-menu');
                if (menuToggle && navMenu) {
                    menuToggle.addEventListener('click', () => {
                        const isOpen = navMenu.classList.toggle('is-open');
                        menuToggle.setAttribute('aria-expanded', String(isOpen));
                        menuToggle.setAttribute('aria-label', isOpen ? 'Cerrar menú' : 'Abrir menú');
                    });
                    navMenu.querySelectorAll('a').forEach(link => {
                        link.addEventListener('click', () => {
                            navMenu.classList.remove('is-open');
                            menuToggle.setAttribute('aria-expanded', 'false');
                            menuToggle.setAttribute('aria-label', 'Abrir menú');
                        });
                    });
                }

                // Inicializar la lógica del buscador del navbar
                const toggle = document.getElementById('navSearchToggle');
                const container = document.querySelector('.nav-search-container');
                const input = document.getElementById('navBuscador');
                const actionButton = document.getElementById('navSearchAction');

                if (toggle && container && input && actionButton) {
                    function setSearchUIState(isOpen) {
                        container.classList.toggle('open', isOpen);
                        toggle.classList.toggle('active', isOpen);
                        if (isOpen) {
                            input.style.width = '160px'; input.style.opacity = '1';
                            input.style.paddingLeft = '0.8rem'; input.style.paddingRight = '0.8rem';
                            input.style.marginLeft = '0.5rem'; input.style.pointerEvents = 'auto';
                            actionButton.style.width = 'auto'; actionButton.style.opacity = '1';
                            actionButton.style.paddingLeft = '0.8rem'; actionButton.style.paddingRight = '0.8rem';
                            actionButton.style.marginLeft = '0.4rem'; actionButton.style.pointerEvents = 'auto';
                            input.focus();
                        } else {
                            input.value = ''; input.style.width = '0'; input.style.opacity = '0';
                            input.style.paddingLeft = '0'; input.style.paddingRight = '0';
                            input.style.marginLeft = '0'; input.style.pointerEvents = 'none';
                            actionButton.style.width = '0'; actionButton.style.opacity = '0';
                            actionButton.style.paddingLeft = '0'; actionButton.style.paddingRight = '0';
                            actionButton.style.marginLeft = '0'; actionButton.style.pointerEvents = 'none';
                            input.blur();
                        }
                    }

                    toggle.addEventListener('click', (event) => {
                        event.stopPropagation();
                        setSearchUIState(!container.classList.contains('open'));
                    });

                    actionButton.addEventListener('click', (event) => {
                        event.preventDefault();
                        event.stopPropagation();
                        document.dispatchEvent(new CustomEvent('navbarSearchRequested', {
                            detail: { value: input.value.trim() }
                        }));
                        setSearchUIState(false);
                    });
                }
             })
            .catch(err => console.error("Error al cargar el navbar:", err));
    </script>
</body>
</html>
